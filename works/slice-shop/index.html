<!doctype html>
<html lang="zh-CN" class="shard-live" data-theme="day">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <base href="../../">
  <meta name="theme-color" content="#F4F6FF">
  <meta name="description" content="一间随四季与昼夜变化的等轴测小店，记录 Springhues 的真实访问量。">
  <title>切片小店 · Springhues</title>
  <link rel="icon" type="image/png" href="brand-assets/springhues-logo.png">
  <script src="site/boot.js?v=20261018-shard-v4"></script>
  <link rel="stylesheet" href="site/css/shard-theme.css?v=20261018-shard-v4">
  <link rel="stylesheet" href="site/css/wipe.css?v=20261018-shard-v4">
  <link rel="stylesheet" href="site/css/pages-scene.css?v=20261018-shard-v4">
  <script type="module" src="site/js/shell/shell.js?v=20261018-shard-v4"></script>
  <script data-goatcounter="https://springhues.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body data-site-page="scene" data-sd-title="切片小店" data-sd-title-en="SCENE">
  <main id="main" class="sd-page" tabindex="-1">
    <header class="sd-hero">
      <div class="sd-wrap">
        <p class="sd-eyebrow" data-sd-reveal="0">SCENE</p>
        <h1 class="sd-h1" data-sd-reveal="1"><span class="en" aria-hidden="true">Scene</span><span class="cn">切片小店</span></h1>
        <p class="sd-lead" data-sd-reveal="2">一间跟着四季和昼夜变化的小店。它记下本站的真实访问。</p>
      </div>
    </header>

    <div class="sd-wrap scene-layout">
      <section class="scene-stage-wrap">
        <div class="scene-stage" data-scene-stage>
          <canvas data-scene-canvas role="img" aria-label="等轴测小店，会随季节和昼夜改变外观"></canvas>
          <p class="scene-hint" aria-hidden="true">拖动画面可微调视角</p>
        </div>
        <div class="scene-chips" role="group" aria-label="切换季节">
          <button class="sd-chip" type="button" data-season="spring" aria-pressed="true">春</button>
          <button class="sd-chip" type="button" data-season="summer" aria-pressed="false">夏</button>
          <button class="sd-chip" type="button" data-season="autumn" aria-pressed="false">秋</button>
          <button class="sd-chip" type="button" data-season="winter" aria-pressed="false">冬</button>
        </div>
      </section>

      <aside class="scene-panel">
        <section class="sd-plate sd-plate--blade" data-sd-reveal="0">
          <h2 class="sd-h2">真实记录</h2>
          <dl class="scene-metrics">
            <div><dt>总访问</dt><dd data-stat="visits">—</dd></div>
            <div><dt>独立访客</dt><dd data-stat="visitors">—</dd></div>
            <div><dt>日报期数</dt><dd data-stat="issues">—</dd></div>
            <div><dt>作品</dt><dd data-stat="works">—</dd></div>
            <div><dt>最近更新</dt><dd data-stat="updated">—</dd></div>
          </dl>
          <p class="sd-note" data-scene-note>正在读取访问数据。</p>
        </section>
      </aside>
    </div>

    <noscript><p class="sd-note">当前浏览器未启用 JavaScript，场景与统计无法显示。<a href="../../">返回首页</a></p></noscript>
  </main>
  <script type="module" src="site/js/scene/main.js?v=20261018-shard-v4"></script>
</body>
</html>
