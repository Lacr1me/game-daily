name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Rebuild embedded archive
        run: node scripts/build-embedded.mjs
      - name: Run full site tests
        run: |
          node scripts/test-daily-operations.mjs
          node scripts/test-site.mjs
          node scripts/test-messages.mjs
          node scripts/test-admin-logs.mjs
      - name: Build static site
        run: node scripts/build-site.mjs
      - name: Verify deployment artifact
        run: node scripts/verify-build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Sync deployed website change log
        continue-on-error: true
        env:
          ADMIN_LOG_SYNC_SECRET: ${{ secrets.ADMIN_LOG_SYNC_SECRET }}
        run: node scripts/sync-admin-logs.mjs --kind=website_change --commit=${GITHUB_SHA} --push
