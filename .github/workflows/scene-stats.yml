name: Refresh Scene Stats

on:
  schedule:
    - cron: "17 1,7,13,19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scene-stats
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch GoatCounter totals
        run: |
          set -euo pipefail
          curl -fsS -m 20 https://springhues.goatcounter.com/counter/TOTAL.json -o count.json
          node -e '
            const fs = require("fs");
            const raw = JSON.parse(fs.readFileSync("count.json", "utf8"));
            const out = {
              visits: Number(raw.count) || 0,
              visitors: Number(raw.count_unique) || 0,
              updated: new Date().toISOString().replace(/\.\d+Z$/, "Z")
            };
            fs.writeFileSync("data/scene-stats.json", JSON.stringify(out, null, 2) + "\n");
          '
          rm count.json
      - name: Commit when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scene-stats.json
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "Refresh scene stats"
          git pull --rebase origin main
          git push
