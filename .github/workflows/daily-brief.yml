name: Generate and publish daily briefs

on:
  schedule:
    # GitHub Actions 使用 UTC；北京时间 10:50。
    - cron: "50 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-brief-publish
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check OpenAI API key
        id: api-key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "OPENAI_API_KEY is not configured; keeping the latest published editions."
          fi

      - name: Generate both channel drafts at 10:50
        id: generate
        if: steps.api-key.outputs.available == 'true'
        shell: bash
        run: |
          set +e
          run_with_retry() {
            script="$1"
            label="$2"
            attempt=1
            while [ "$attempt" -le 2 ]; do
              echo "Generating $label (attempt $attempt/2)..."
              if node "$script"; then return 0; fi
              if [ "$attempt" -lt 2 ]; then
                echo "$label generation failed; cooling down for 90 seconds before retry."
                sleep 90
              fi
              attempt=$((attempt + 1))
            done
            return 1
          }

          # 民生日报优先，避免两个长请求同时耗尽项目 TPM 配额。
          if run_with_retry scripts/generate-minsheng.mjs civic; then
            echo "civic=true" >> "$GITHUB_OUTPUT"
          else
            echo "civic=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Cooling down for 75 seconds before the game channel."
          sleep 75
          if run_with_retry scripts/generate-brief.mjs game; then
            echo "game=true" >> "$GITHUB_OUTPUT"
          else
            echo "game=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.4-mini

      - name: Wait until 11:00 Beijing time
        if: always() && steps.api-key.outputs.available == 'true' && (steps.generate.outputs.game == 'true' || steps.generate.outputs.civic == 'true')
        run: |
          now=$(TZ=Asia/Shanghai date +%s)
          target=$(TZ=Asia/Shanghai date -d "$(TZ=Asia/Shanghai date +%F) 11:00:00" +%s)
          if [ "$now" -lt "$target" ]; then
            sleep "$((target - now))"
          fi

      - name: Publish game brief
        id: publish-game
        if: always() && steps.generate.outputs.game == 'true'
        continue-on-error: true
        run: node scripts/publish-brief.mjs

      - name: Publish civic brief
        id: publish-civic
        if: always() && steps.generate.outputs.civic == 'true'
        continue-on-error: true
        run: node scripts/publish-minsheng.mjs

      - name: Commit successful editions
        if: always() && (steps.publish-game.outcome == 'success' || steps.publish-civic.outcome == 'success')
        run: |
          git config user.name "daily-brief-bot"
          git config user.email "daily-brief-bot@users.noreply.github.com"
          git add data
          git commit -m "content: publish daily briefs" || exit 0
          git push origin main

      - name: Report channel failures
        if: always() && steps.api-key.outputs.available == 'true'
        run: |
          echo "game generated: ${{ steps.generate.outputs.game }} / publish: ${{ steps.publish-game.outcome }}"
          echo "civic generated: ${{ steps.generate.outputs.civic }} / publish: ${{ steps.publish-civic.outcome }}"
